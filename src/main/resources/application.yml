spring:
  application:
    name: estantedigital

  datasource:
    url: jdbc:h2:mem:estantedigital
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: false
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

app:
  security:
    username: ${APP_AUTH_USERNAME:student}
    password: ${APP_AUTH_PASSWORD:student}
    jwt:
      secret: ${APP_JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      expiration-seconds: 3600

logging:
  level:
    org.hibernate.SQL: DEBUG