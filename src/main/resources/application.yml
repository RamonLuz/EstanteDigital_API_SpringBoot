spring:
  application:
    name: estantedigital

  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${DB_URL:jdbc:h2:mem:estantedigital;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    username: sa
    password:

  flyway:
    enabled: true

  h2:
    console:
      enabled: false
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: false

    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: EstanteDigital API
    description: API de gerenciamento de livros, clientes, funcionários e vendas

app:
  security:
    username: ${APP_AUTH_USERNAME:student}
    password: ${APP_AUTH_PASSWORD:student}
    jwt:
      secret: ${APP_JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      expiration-seconds: 3600

logging:
  level:
    com.estantedigital: INFO